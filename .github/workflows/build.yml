name: Build

on:
  push:
    branches: ['**']
    tags-ignore: ['*.*.*-*']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Each Stonecutter node compiles on its own toolchain (17 for 1.20.1, 21 for 1.21.1). The last
      # one listed becomes JAVA_HOME and runs Gradle.
      - name: Set up Java 17, 21 and 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            17
            21
            25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build every node
        run: ./gradlew buildAndCollect

      - name: Game tests
        run: ./gradlew :1.20.1-fabric:runGameTest :1.20.1-forge:runGameTest :1.21.1-fabric:runGameTest

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: build/libs/*/*.jar

      - name: Upload game test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-report
          path: versions/*/build/gametest/report.xml
          if-no-files-found: ignore
