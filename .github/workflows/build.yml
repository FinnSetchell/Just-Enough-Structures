name: Build

on:
  push:
    branches: ['**']
    tags-ignore: ['*.*.*-*']
  pull_request:
    branches: ['**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Each Stonecutter node compiles on its own toolchain (17 for 1.20.1, 21 for 1.21.1, 25 for
      # 26.x). The last one listed becomes JAVA_HOME and runs Gradle, which the 26.x nodes need on 25.
      - name: Set up Java 17, 21 and 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            17
            21
            25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build every node
        run: ./gradlew buildAndCollect

      - name: Game tests
        run: >-
          ./gradlew :1.20.1-fabric:runGameTest :1.20.1-forge:runGameTest
          :1.21.1-fabric:runGameTest :1.21.1-neoforge:runGameTest :1.21.1-forge:runGameTest
          :26.1.2-fabric:runGameTest :26.1.2-neoforge:runGameTest :26.1.2-forge:runGameTest
          :26.2-fabric:runGameTest :26.2-neoforge:runGameTest :26.2-forge:runGameTest
          :26.3-fabric:runGameTest :26.3-neoforge:runGameTest :26.3-forge:runGameTest

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: build/libs/*/*.jar

      - name: Upload game test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-report
          path: versions/*/build/gametest/report.xml
          if-no-files-found: ignore

  # The game tests again with the real C2ME in each run (-Pc2me, buildSrc/GameTestMods.kt), on the
  # nine nodes C2ME has a build for. Forge has none. A job of its own, so the build above doesn't wait
  # for it, and the run fails if any of these fail.
  c2me:
    name: Game tests with C2ME
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17, 21 and 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: |
            17
            21
            25

      # Reads the cache the build above saves and saves none of its own. That one is about 4.5 GB a
      # push, and a second as big from this job could push it out of the cache and leave the build
      # above starting cold.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      # --continue: a node that fails doesn't stop the others, so one run names every node that fails.
      - name: Game tests with C2ME
        run: >-
          ./gradlew --continue -Pc2me
          :1.20.1-fabric:runGameTest
          :1.21.1-fabric:runGameTest :1.21.1-neoforge:runGameTest
          :26.1.2-fabric:runGameTest :26.1.2-neoforge:runGameTest
          :26.2-fabric:runGameTest :26.2-neoforge:runGameTest
          :26.3-fabric:runGameTest :26.3-neoforge:runGameTest

      # With each server's log, where C2ME's own lines show it started.
      - name: Upload game test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gametest-report-c2me
          path: |
            versions/*/build/gametest/report.xml
            versions/*/build/gametest/logs/latest.log
          if-no-files-found: ignore
