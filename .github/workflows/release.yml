# release-actions is private, and a public repo can't call a private repo's
# reusable workflow, so this checks it out with RELEASE_ACTIONS_TOKEN and runs
# it as a local composite action.

name: Release

on:
  push:
    tags: ['*.*.*-*', '*.*.*-alpha.*-*']

permissions:
  contents: write

jobs:
  release:
    name: Plan, build, review card
    runs-on: ubuntu-latest
    concurrency:
      group: mods-release-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout mod at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0   # full history + branches for the plan's branch sanity check

      - name: Checkout release-actions
        uses: actions/checkout@v4
        with:
          repository: FinnSetchell/release-actions
          ref: v2
          path: .release-actions
          # The github.token fallback only works if release-actions is made public.
          token: ${{ secrets.RELEASE_ACTIONS_TOKEN || github.token }}

      - name: Release
        uses: ./.release-actions/actions/release-plan
        with:
          worker_api_key: ${{ secrets.WORKER_API_KEY }}
