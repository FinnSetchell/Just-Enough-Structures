# Publishing settings for release-actions. Only the copy on main is read.
schema: 1
mod:
  id: justenoughstructures
  displayName: "Just Enough Structures"
  # Needed on both sides: the server generates the structures and rolls the loot, the client shows them.
  environments: [Client, Server]
  name: JustEnoughStructures
  validate: false
platforms:
  curseforge: { projectId: 1733995, slug: just-enough-structures }
  modrinth:   { projectId: FLDP7V2S, slug: just-enough-structures }
discord:
  embedColor: "#7a5a1f"
  pingDefault: true
artifacts:
  - type: mod-jar
# Each loader gets its own target and tag, e.g. 0.1.0-fabric, 0.1.0-forge or 0.1.0-neoforge. Each build is one node from
# settings.gradle.kts. `java` is the Java that runs Gradle; the node's own toolchain is downloaded.
# Optional mods are the ones JES does more with. LuckPerms is left off NeoForge, where its
# 1.21.1 build fails every login.
targets:
  - branch: main
    tagLabel: fabric
    loaders: [fabric]
    buildCommand: ":{mc}-fabric:build"
    jarDir: "versions/{mc}-fabric/build/libs"
    builds:
      - { mc: "1.20.1", java: 25 }
      # 1.21 and 1.21.1 are the same game to a mod, so the one jar serves both.
      - { mc: "1.21.1", from: "1.21", java: 25 }
      # Likewise 26.1, 26.1.1 and 26.1.2.
      - { mc: "26.1.2", from: "26.1", java: 25 }
      - { mc: "26.2", java: 25 }
      - { mc: "26.3", java: 25 }
    dependencies:
      - { modrinth: P7dR8mSH, curseforge: fabric-api, type: required }
      - { modrinth: u6dRKJwZ, curseforge: jei, type: optional }
      - { modrinth: fRiHVvU7, curseforge: emi, type: optional }
      - { modrinth: nfn13YXA, curseforge: roughly-enough-items, type: optional }
      - { modrinth: RV1qfVQ8, curseforge: explorers-compass, type: optional }
      - { modrinth: 9s6osm5g, curseforge: cloth-config, type: optional }
      - { modrinth: mOgUt4GM, curseforge: modmenu, type: optional }
      - { modrinth: Vebnzrzj, curseforge: luckperms, type: optional }
  - branch: main
    tagLabel: forge
    loaders: [forge]
    buildCommand: ":{mc}-forge:build"
    jarDir: "versions/{mc}-forge/build/libs"
    builds:
      - { mc: "1.20.1", java: 25 }
      - { mc: "1.21.1", java: 25 }
      - { mc: "26.1.2", java: 25 }
      - { mc: "26.2", java: 25 }
      - { mc: "26.3", java: 25 }
    dependencies:
      - { modrinth: u6dRKJwZ, curseforge: jei, type: optional }
      - { modrinth: fRiHVvU7, curseforge: emi, type: optional }
      - { modrinth: nfn13YXA, curseforge: roughly-enough-items, type: optional }
      - { modrinth: RV1qfVQ8, curseforge: explorers-compass, type: optional }
      - { modrinth: 9s6osm5g, curseforge: cloth-config, type: optional }
      - { modrinth: Vebnzrzj, curseforge: luckperms, type: optional }
  - branch: main
    tagLabel: neoforge
    loaders: [neoforge]
    buildCommand: ":{mc}-neoforge:build"
    jarDir: "versions/{mc}-neoforge/build/libs"
    builds:
      - { mc: "1.21.1", java: 25 }
      - { mc: "26.1.2", java: 25 }
      - { mc: "26.2", java: 25 }
      - { mc: "26.3", java: 25 }
    dependencies:
      - { modrinth: u6dRKJwZ, curseforge: jei, type: optional }
      - { modrinth: fRiHVvU7, curseforge: emi, type: optional }
      - { modrinth: nfn13YXA, curseforge: roughly-enough-items, type: optional }
      - { modrinth: RV1qfVQ8, curseforge: explorers-compass, type: optional }
      - { modrinth: 9s6osm5g, curseforge: cloth-config, type: optional }
