# Per-node values. Mod metadata that never varies stays in gradle.properties.
# Tables are picked per node by `properties { tags(version, loader) }` in stonecutter.gradle.kts, so
# `deps.fabric_api` resolves to whatever the matching [fabric."<version>"] table declares.
#
# mod.mc_build is the Minecraft version a node compiles against and mod.mc_compat is the range the
# jar declares, in the loader's own syntax.

# Loom for the obfuscated versions, applied by dev.kikugie.loom-back-compat.
loomx.loom_version = "1.17-SNAPSHOT"

# ------------------------------------------------------------------ 1.20.1 (Java 17)
["1.20.1"]
mod.java = "17"

[fabric."1.20.1"]
mod.mc_build = "1.20.1"
mod.mc_compat = "~1.20.1"
mod.fabric_loader_dep = ">=0.15.0"
deps.fabric_loader = "0.19.5"
deps.fabric_api = "0.92.11+1.20.1"
deps.modmenu = "7.2.2"
deps.cloth_config = "11.1.136"
# Compiled against for the optional JEI plugin, never bundled.
deps.jei = "15.56.0.205"
# Likewise EMI and REI, and Architectury, which REI's API uses. Modrinth version ids, so the
# dev runtime can run the same jars: EMI 1.1.24, REI 12.1.785, Architectury 9.2.14.
deps.emi = "YbXDHf8W"
deps.rei = "nYcMSS03"
deps.architectury = "WbL7MStR"
# Explorer's Compass, compiled against for the optional compass link. A Modrinth version id.
deps.explorers_compass = "qD2j03H6"
