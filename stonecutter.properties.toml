# Per-node values. Mod metadata that never varies stays in gradle.properties.
# Tables are picked per node by `properties { tags(version, loader) }` in stonecutter.gradle.kts, so
# `deps.fabric_api` resolves to whatever the matching [fabric."<version>"] table declares.
#
# mod.mc_build is the Minecraft version a node compiles against and mod.mc_compat is the range the
# jar declares, in the loader's own syntax.

# Loom for the obfuscated versions, applied by dev.kikugie.loom-back-compat.
loomx.loom_version = "1.17-SNAPSHOT"

# ------------------------------------------------------------------ 1.20.1 (Java 17)
["1.20.1"]
mod.java = "17"

[fabric."1.20.1"]
mod.mc_build = "1.20.1"
mod.mc_compat = "~1.20.1"
mod.fabric_loader_dep = ">=0.15.0"
deps.fabric_loader = "0.19.5"
deps.fabric_api = "0.92.11+1.20.1"
deps.modmenu = "7.2.2"
deps.cloth_config = "11.1.136"
# Compiled against for the optional JEI plugin, never bundled.
deps.jei = "15.56.0.205"
# Likewise EMI and REI, and Architectury, which REI's API uses. Modrinth version ids, so the
# dev runtime can run the same jars: EMI 1.1.24, REI 12.1.785, Architectury 9.2.14.
deps.emi = "YbXDHf8W"
deps.rei = "nYcMSS03"
deps.architectury = "WbL7MStR"
# Explorer's Compass, compiled against for the optional compass link. A Modrinth version id.
deps.explorers_compass = "qD2j03H6"
# The JEI the dev runtime runs, a Modrinth version id, and the config library its later builds need.
deps.jei_runtime = "YRfUnbXb"
deps.jei_config = ""

# Forge's own line carried on past the NeoForge fork, so it covers 1.20.1 too. The floor is the
# major version rather than the build, as launcher instances often sit a few builds behind.
[forge."1.20.1"]
mod.mc_build = "1.20.1"
# The resource pack format the jar's pack.mcmeta declares.
mod.pack_format = "15"
mod.mc_compat = "[1.20.1,1.20.2)"
deps.forge_version = "47.4.10"
deps.forge_min = "47"
# Forge 1.20.1 doesn't ship MixinExtras, which the mixins use, so the jar carries it.
deps.mixinextras = "0.4.1"
deps.cloth_config = "11.1.136"
deps.jei = "15.56.0.205"
# Modrinth version ids of the Forge builds: EMI 1.1.24, REI 12.1.785, Architectury 9.2.14 and
# Explorer's Compass 1.4.0.
deps.emi = "Axuu9I9R"
deps.rei = "IoS2AjPk"
deps.architectury = "1MKTLiiG"
deps.explorers_compass = "7ZdJbCOx"

# ------------------------------------------------------------------ 1.21.1 (Java 21)
["1.21.1"]
mod.java = "21"

[fabric."1.21.1"]
mod.mc_build = "1.21.1"
# 1.21 and 1.21.1 are the same game to a mod; 1.21.2 isn't.
mod.mc_compat = ">=1.21 <1.21.2"
mod.fabric_loader_dep = ">=0.15.0"
deps.fabric_loader = "0.19.5"
deps.fabric_api = "0.116.17+1.21.1"
deps.modmenu = "11.0.3"
deps.cloth_config = "15.0.140"
deps.jei = "19.57.0.451"
# 19.56.0.441: JEI's later builds need Loom 1.18, which needs Gradle on Java 25.
deps.jei_runtime = "r1Jkfnic"
deps.jei_config = "Q5Yns1Qe"
# Modrinth version ids: EMI 1.1.24, REI 16.0.799, Architectury 13.0.11, Explorer's Compass 2.6.0.
deps.emi = "on5GT1qh"
deps.rei = "aWzTESNC"
deps.architectury = "Pzc2FP5K"
deps.explorers_compass = "qSRKiE4D"

# Forge 52 is the 1.21.1 line, the only one this jar loads on. Built against the 1.21.1 instance's
# own early build, so the jar never needs anything newer than launchers commonly run.
[forge."1.21.1"]
mod.mc_build = "1.21.1"
mod.mc_compat = "[1.21.1,1.21.2)"
mod.pack_format = "34"
deps.forge_version = "52.1.0"
deps.forge_min = "52"
# Forge 1.21.1 doesn't ship MixinExtras, which the mixins use, so the jar carries it.
deps.mixinextras = "0.4.1"
deps.cloth_config = "15.0.140"
deps.jei = "19.57.0.451"
# EMI and REI have no Forge build for 1.21.1, so their pages are left out. Explorer's Compass 1.3.8.
deps.emi = ""
deps.rei = ""
deps.explorers_compass = "kZHy6sq5"

# NeoForge only runs on the Minecraft version it was built for. The floor is its line for 1.21.1
# rather than a build, as launcher instances often sit a few builds behind.
[neoforge."1.21.1"]
mod.mc_build = "1.21.1"
mod.mc_compat = "[1.21.1,1.21.2)"
deps.neoforge_version = "21.1.255"
deps.neoforge_min = "21.1"
deps.cloth_config = "15.0.140"
deps.jei = "19.57.0.451"
# Modrinth version ids of the NeoForge builds: EMI 1.1.24, REI 16.0.799, Architectury 13.0.11 and
# Explorer's Compass 3.4.0.
deps.emi = "5sIPA1To"
deps.rei = "b8gfS9Je"
deps.architectury = "1IiqEQGl"
deps.explorers_compass = "hIJ2Ev1Q"

# ------------------------------------------------------------------ 26.1.2 (Java 25, unobfuscated)
["26.1.2"]
mod.java = "25"

[fabric."26.1.2"]
mod.mc_build = "26.1.2"
# 26.1, 26.1.1 and 26.1.2 are the same game to a mod.
mod.mc_compat = "~26.1"
mod.fabric_loader_dep = ">=0.15.0"
deps.fabric_loader = "0.19.5"
deps.fabric_api = "0.155.3+26.1.2"
deps.modmenu = "18.0.2"
deps.cloth_config = "26.1.154"
deps.jei = "29.34.0.90"
# Modrinth version ids: JEI 29.34.0.90 and the config library it needs, REI 26.1.819, Architectury
# 20.1.16 and Explorer's Compass 2.5.1. EMI has no build for 26.1.
deps.jei_runtime = "jZ7OgHsw"
deps.jei_config = "H7JmEX05"
deps.emi = ""
deps.rei = "EAlqUmgQ"
deps.architectury = "Y7kRthh0"
deps.explorers_compass = "FN4lCamU"

# NeoForge only runs on the Minecraft version it was built for. Built against the build the 26.1.2
# instance runs; the floor is the line's base, as launcher instances often sit a few builds behind
# and a -beta build sorts below a plain one.
[neoforge."26.1.2"]
mod.mc_build = "26.1.2"
mod.mc_compat = "[26.1.2,26.1.3)"
deps.neoforge_version = "26.1.2.109"
deps.neoforge_min = "26.1.2.0-beta"
deps.cloth_config = "26.1.154"
deps.jei = "29.34.0.90"
# Modrinth version ids of the NeoForge builds: REI 26.1.819, Architectury 20.1.16 and Explorer's
# Compass 3.3.0. EMI has no build for 26.1.
deps.emi = ""
deps.rei = "isd1MxO2"
deps.architectury = "9PW5lWrQ"
deps.explorers_compass = "OuPMcvp4"

# Forge 64 is the 26.1.2 line. Built against the 26.1.2 instance's own build, so the jar never needs
# anything newer than launchers commonly run. From here Forge ships MixinExtras itself, and none of
# JEI, EMI, REI, Cloth Config and Explorer's Compass has a Forge build for 26.1.
[forge."26.1.2"]
mod.mc_build = "26.1.2"
mod.mc_compat = "[26.1.2,26.1.3)"
# 26.1 numbers resource pack and data pack formats apart, so this is from the one to the other.
mod.pack_format = "84-101"
deps.forge_version = "64.0.8"
deps.forge_min = "64"
deps.mixinextras = ""
deps.cloth_config = ""
deps.jei = ""
deps.emi = ""
deps.rei = ""
deps.explorers_compass = ""

