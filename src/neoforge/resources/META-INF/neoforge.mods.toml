modLoader = "javafml"
loaderVersion = "[4,)"
license = "${license}"
issueTrackerURL = "https://github.com/FinnSetchell/Just-Enough-Structures/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = '''${description}'''
displayURL = "https://github.com/FinnSetchell/Just-Enough-Structures"
# NeoForge up to 26.1 only reads logoFile. From 26.2 the mod list shows iconFile beside the mod's name,
# and dev runs warn about a logoFile with neither iconFile nor bannerFile.
logoFile = "assets/justenoughstructures/icon.png"
iconFile = "assets/justenoughstructures/icon.png"

[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_min},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${mc_compat}"
ordering = "NONE"
side = "BOTH"
