modLoader = "javafml"
loaderVersion = "[${forge_min},)"
license = "${license}"
issueTrackerURL = "https://github.com/FinnSetchell/Just-Enough-Structures/issues"

[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "${mod_author}"
description = '''${description}'''
displayURL = "https://github.com/FinnSetchell/Just-Enough-Structures"
logoFile = "assets/justenoughstructures/icon.png"
# Players without it can still join a server that has it, and the other way round.
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[${forge_min},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${mc_compat}"
ordering = "NONE"
side = "BOTH"
