# Gradle
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
# ForgeGradle 7 nodes: each source set's classes and resources in one folder, so a dev run loads each
# as one mod. Apart, Forge 1.21 left the game test mod's classes outside the game's class loader.
net.minecraftforge.gradle.merge-source-sets=true

# Project. Per-version loader and dependency versions live in stonecutter.properties.toml.
mod_version=0.1.0
group=com.finndog.justenoughstructures
mod_name=Just Enough Structures
mod_author=FinnDog
mod_id=justenoughstructures
archives_base_name=JustEnoughStructures
license=LGPL-3.0-or-later
description=Browse every structure in the game, spin it around in 3D and open its chests to see what they can hold.
